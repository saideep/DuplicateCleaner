[project]
name = "duplicate-cleaner"
version = "0.1.1"
description = "Intelligent duplicate detection and cleanup for macOS. Exact, near-duplicate, semantic, and project-tree aware."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "vaannada" }]

dependencies = [
    "blake3>=0.4.1,<0.5",
    "send2trash>=1.8.3,<2",
    "typer>=0.12.5,<0.13",
    "jinja2>=3.1.4,<4",
    "pydantic>=2.8.2,<3",
    "tomli-w>=1.0.0,<2",
    "rich>=13.7.1,<14",
    "psutil>=6.0.0,<7",
    "google-api-python-client>=2.144.0,<3",
    "google-auth>=2.35.0,<3",
    "google-auth-oauthlib>=1.2,<2",
    "tenacity>=9.0,<10",
    "httpx>=0.27.0,<0.28",
    "msal>=1.31.0,<2",
]

[project.optional-dependencies]
image = ["imagehash>=4.3.1,<5", "Pillow>=10.4.0,<11"]
audio = ["pyacoustid>=1.3.0,<2"]
pdf = ["pdfplumber>=0.11.4,<0.12"]
text = ["rapidfuzz>=3.9.6,<4"]
all = [
    "imagehash>=4.3.1,<5",
    "Pillow>=10.4.0,<11",
    "pyacoustid>=1.3.0,<2",
    "pdfplumber>=0.11.4,<0.12",
    "rapidfuzz>=3.9.6,<4",
]

[project.scripts]
dc = "duplicate_cleaner.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.2,<9",
    "pytest-cov>=5.0.0,<6",
    "ruff>=0.6.4,<0.7",
    "mypy>=1.11.2,<2",
    "pre-commit>=3.8.0,<4",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duplicate_cleaner"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/duplicate_cleaner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# G2: point pytest at /tmp instead of $TMPDIR (which is
# /var/folders/... — now in EXCLUDED_ROOTS). ``/tmp`` symlinks to
# ``/private/tmp`` which is NOT excluded, so tests exercising the scanner
# still work end-to-end.
addopts = "-ra --strict-markers --basetemp=/tmp/pytest-dc"
